name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Setup environment variables
        run: |
          echo "PROD_URL=${{ secrets.PROD_URL }}" > .env
          echo "PROD_API_KEY=${{ secrets.PROD_API_KEY }}" >> .env
          echo "NODE_ENV=production" >> .env

      - name: Install dependencies
        run: yarn install

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'

      - name: Install Build Tools
        run: sdkmanager "build-tools;29.0.3"

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build with Gradle
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          PROD_API_KEY: ${{ secrets.PROD_API_KEY }}
          NODE_ENV: production
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Extract Changelog
        id: extract_changelog
        run: |
          # Get the version from the tag name (remove 'v' prefix)
          VERSION=${GITHUB_REF_NAME#v}
          
          SECTION_CONTENT=$(awk -v ver="$VERSION" '
            BEGIN { output=""; found=0; }
            /^## v'"$VERSION"'/ { found=1; next; }
            /^## / { if (found) exit; }
            found { output = output $0 "\n"; }
            END { print output; }
          ' CHANGELOG.md)
          
          if [ -z "$SECTION_CONTENT" ]; then
            SECTION_CONTENT=$(awk -v ver="$VERSION" '
              BEGIN { output=""; found=0; }
              /^## '"$VERSION"'/ { found=1; next; }
              /^## / { if (found) exit; }
              found { output = output $0 "\n"; }
              END { print output; }
            ' CHANGELOG.md)
          fi
          
          echo "$SECTION_CONTENT" > changelog_temp.md
          
          CHANGELOG_CONTENT=$(cat changelog_temp.md | sed -z 's/%/%25/g' | sed -z 's/\n/%0A/g' | sed -z 's/\r/%0D/g')
          echo "changelog=$CHANGELOG_CONTENT" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            android/app/build/outputs/apk/release/app-release-signed.apk
          name: Release ${{ github.ref_name }}
          body: ${{ steps.extract_changelog.outputs.changelog }}
          draft: false
          prerelease: false